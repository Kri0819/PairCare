<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#C4785A" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PairCare｜陪一刻" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>PairCare｜陪一刻</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#FAF7F2}
    body{font-family:sans-serif}
    #root{min-height:100svh}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#FAF7F2 55%,#F5E6DE);gap:20px;z-index:9999;transition:opacity .5s}
    #loading h1{font-size:2.4rem;letter-spacing:.12em;color:#231C10;font-weight:400}
    #loading .sub{font-size:.75rem;letter-spacing:.2em;color:#C4785A;font-family:sans-serif;margin-top:-12px}
    #loading .dots{display:flex;gap:8px}
    #loading .dot{width:8px;height:8px;border-radius:50%;background:#C4785A;animation:pulse 1.2s ease-in-out infinite}
    #loading .dot:nth-child(2){animation-delay:.2s}
    #loading .dot:nth-child(3){animation-delay:.4s}
    @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
    #loading.out{opacity:0;pointer-events:none}
    #crash{display:none;position:fixed;inset:0;background:#FAF7F2;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:40px;text-align:center;z-index:10000;font-family:sans-serif}
    #crash.show{display:flex}
    #crash h2{font-size:1.2rem;color:#231C10}
    #crash p{font-size:.85rem;color:#998870;line-height:1.65;max-width:300px}
    #crash .err{font-family:monospace;font-size:.72rem;color:#C4785A;background:#FDF0EA;padding:8px 12px;border-radius:8px;max-width:320px;word-break:break-all;max-height:80px;overflow:hidden}
    #crash button{padding:13px 28px;color:white;border:none;border-radius:10px;font-size:.9rem;cursor:pointer;width:100%;max-width:280px}
    #crash .btn1{background:#C4785A}
    #crash .btn2{background:#998870}
  </style>
</head>
<body>
<div id="loading">
  <h1>陪一刻</h1>
  <div class="sub">PairCare</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>
<div id="crash">
  <h2>無法啟動</h2>
  <p>PairCare 發生錯誤。<br>點擊下方按鈕重新啟動。</p>
  <div class="err" id="crash-msg"></div>
  <button class="btn1" onclick="location.reload()">重新啟動</button>
  <button class="btn2" onclick="localStorage.clear();location.reload()">清除資料並重啟</button>
</div>
<div id="root"></div>

<script>
function showCrash(msg){
  document.getElementById('loading').classList.add('out');
  document.getElementById('crash').classList.add('show');
  if(msg) document.getElementById('crash-msg').textContent=String(msg).slice(0,200);
}
window.onerror=function(msg,src,line,col,err){showCrash((err&&err.message)?err.message:msg);return true;};
window.addEventListener('unhandledrejection',function(e){console.error('[PairCare]',e.reason);});
</script>

<!-- App (inlined — no external JS file needed) -->
<script>
"use strict";
console.log('[PairCare] v12.0 start');

// ── JSX runtime shim (React UMD globals) ─────────────────────────────────────
var _jsxRuntime = {
  jsx:      React.createElement,
  jsxs:     React.createElement,
  Fragment: React.Fragment
};

// ── Supabase client ───────────────────────────────────────────────────────────
var SUPABASE_URL  = "https://hmxajsjowjejqlvjrybe.supabase.co";
var SUPABASE_ANON = "sb_publishable_bdx1QmWjMMdIAPxliLRmTA_-C_UsC2W";
var _sbClient = null;

function getSupabase() {
  if (_sbClient) return _sbClient;
  try {
    var sb = window.supabase;
    var fn = sb && (sb.createClient || (sb.default && sb.default.createClient));
    if (!fn) { console.warn('[PairCare] Supabase CDN not ready'); return null; }
    _sbClient = fn(SUPABASE_URL, SUPABASE_ANON, {
      auth: {
        persistSession:     true,
        autoRefreshToken:   true,
        detectSessionInUrl: true,
        storage:            window.localStorage,
        storageKey:         'paircare_session',
        flowType:           'pkce',
      }
    });
    console.log('[PairCare] Supabase ready');
  } catch(e) { console.error('[PairCare] Supabase init:', e); }
  return _sbClient;
}

// ── Cross-device sync: pair_data table, keyed by pairId ──────────────────────
// One row per pair, entire app-relevant state stored as JSONB. This is how
// data actually becomes shared across devices — everything before this was
// localStorage-only and NEVER left the device.
var SYNC_FIELDS = ["pair", "medications", "doseLogs", "scheduleLog", "doctorVisits", "settings"];

function pullPairData(pairId) {
  var sb = getSupabase();
  if (!sb || !pairId) return Promise.resolve(null);
  return sb.from("pair_data")
    .select("data")
    .eq("pair_id", pairId)
    .maybeSingle()
    .then(function(res) {
      if (res.error) { console.error('[PairCare] pull error:', res.error); return null; }
      return (res.data && res.data.data) || null;
    })
    .catch(function(e) { console.error('[PairCare] pull exception:', e); return null; });
}

function pushPairData(pairId, stateSlice, userId) {
  var sb = getSupabase();
  if (!sb || !pairId) return Promise.resolve(false);
  return sb.from("pair_data")
    .upsert({ pair_id: pairId, data: stateSlice, updated_by: userId || null }, { onConflict: "pair_id" })
    .then(function(res) {
      if (res.error) { console.error('[PairCare] push error:', res.error); return false; }
      return true;
    })
    .catch(function(e) { console.error('[PairCare] push exception:', e); return false; });
}

// ── 1. CONSTANTS ─────────────────────────────────────────────────────────────
var STORAGE_KEY = "paircare_v8";

var PERIODS = [
  { id: "breakfast_before", label: "早餐前",   defaultTime: "07:30", icon: "🌅" },
  { id: "breakfast_after",  label: "早餐後",   defaultTime: "08:00", icon: "🍳" },
  { id: "lunch_before",     label: "午餐前",   defaultTime: "11:30", icon: "☀️" },
  { id: "lunch_after",      label: "午餐後",   defaultTime: "12:30", icon: "🥗" },
  { id: "dinner_before",    label: "晚餐前",   defaultTime: "17:30", icon: "🌇" },
  { id: "dinner_after",     label: "晚餐後",   defaultTime: "18:30", icon: "🍜" },
  { id: "bedtime",          label: "睡前",     defaultTime: "22:00", icon: "🌙" },
  { id: "custom",           label: "自訂時間", defaultTime: "09:00", icon: "⏰" },
];
var PERIOD_MAP = {};
PERIODS.forEach(function(p) { PERIOD_MAP[p.id] = p; });

// ── 2. EMPTY STATE ────────────────────────────────────────────────────────────
// user.pairId links to pair.id
// ALL data records carry pairId for isolation
var EMPTY_STATE = {
  // Auth + identity
  user: null,
  // {
  //   id: supabase uid,
  //   email: string,
  //   name: string,
  //   role: "patient" | "supporter",
  //   pairId: string | null
  // }

  // Pair relationship
  pair: null,
  // {
  //   id: string,
  //   patientId: string,
  //   supporterId: string | null,
  //   inviteCode: string,
  //   locked: bool,
  //   createdAt: ISO
  // }

  medications:  [],
  // { id, pairId, name, status, totalCount, remainingCount, schedules[], createdAt }

  doseLogs:     [],
  // { id, pairId, medicationId, periodId, scheduledTime, takenAt, displayTime, status }
  // status: "taken" | "missed" | "late"

  scheduleLog:  {},
  // legacy key-value, kept for backward compat
  // key: "date|medId|periodId"
  // val: { takenAt, displayTime, periodId, medicationId }

  doctorVisits: [],
  settings: {
    dayResetHour:  4,
    reminderTimes: [],          // legacy, kept for migration
    reminderMinutesBefore: [10], // minutes before scheduled dose
    periodTimes: {
      breakfast_before: "07:30",
      breakfast_after:  "08:00",
      lunch_before:     "11:30",
      lunch_after:      "12:30",
      dinner_before:    "17:30",
      dinner_after:     "18:30",
      bedtime:          "22:00"
    }
  },
};

// ── 3. HELPERS ────────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2, 10); }

function newInviteCode() {
  return Math.random().toString(36).slice(2, 8).toUpperCase();
}

function getLogicalDate(h) {
  try {
    var hour = Number(h) || 4;
    var now  = new Date();
    if (now.getHours() < hour) {
      var d = new Date(now); d.setDate(d.getDate() - 1);
      return d.toISOString().slice(0, 10);
    }
    return now.toISOString().slice(0, 10);
  } catch(e) { return new Date().toISOString().slice(0, 10); }
}

function nowHHMM() {
  try { return new Date().toTimeString().slice(0, 5); } catch(e) { return "00:00"; }
}

function periodTime(sched, periodTimes) {
  if (!sched) return "08:00";
  if (sched.periodId === "custom" && sched.customTime) return sched.customTime;
  // Check explicit time on schedule first (per-drug override)
  if (sched.time) return sched.time;
  // Then settings.periodTimes
  if (periodTimes && periodTimes[sched.periodId]) return periodTimes[sched.periodId];
  // Fallback to PERIOD_MAP default
  var p = PERIOD_MAP[sched.periodId];
  return (p && p.defaultTime) || "08:00";
}

// Get resolved time for a periodId from settings
function getDefaultPeriodTime(periodId, periodTimes) {
  if (periodTimes && periodTimes[periodId]) return periodTimes[periodId];
  var p = PERIOD_MAP[periodId];
  return (p && p.defaultTime) || "08:00";
}

function toMins(hhmm) {
  try {
    var parts = (hhmm || "00:00").split(":");
    return (Number(parts[0]) || 0) * 60 + (Number(parts[1]) || 0);
  } catch(e) { return 0; }
}

function doseKey(dateStr, medId, periodId) {
  return String(dateStr) + "|" + String(medId) + "|" + String(periodId);
}

function estimateFinishDate(remaining, dailyDose) {
  try {
    if (!dailyDose || dailyDose <= 0 || !remaining || remaining <= 0) return null;
    var days = Math.floor(remaining / dailyDose);
    if (!isFinite(days) || days < 0) return null;
    var d = new Date(); d.setDate(d.getDate() + days);
    return { days: days, date: d.toLocaleDateString("zh-TW", { month:"numeric", day:"numeric" }) };
  } catch(e) { return null; }
}

// ── 4. STORAGE ────────────────────────────────────────────────────────────────
function safeJSON(raw) {
  try { return JSON.parse(raw); } catch(e) { return null; }
}

function sanitizeMed(m) {
  if (!m || typeof m !== "object") return null;
  return {
    id:             m.id             || uid(),
    pairId:         m.pairId         || null,
    name:           String(m.name    || "未知藥物"),
    status:         ["active","paused","completed"].includes(m.status) ? m.status : "active",
    totalCount:     Number(m.totalCount)     || 0,
    remainingCount: Number(m.remainingCount) || 0,
    createdAt:      m.createdAt      || new Date().toISOString(),
    schedules:      Array.isArray(m.schedules) ? m.schedules.filter(Boolean)
                    : [{ periodId:"breakfast_after", customTime:null, dose:1 }],
    // v11.10 additions — all optional, never break old data
    photo:          (typeof m.photo === "string" && m.photo) || null, // base64 data URL
    method:         (typeof m.method === "string" && m.method) || "口服",
    refills:        Array.isArray(m.refills) ? m.refills.filter(Boolean) : [],
    // refills item: { id, date, source, amount }
  };
}

function sanitizeDoseLog(d) {
  if (!d || typeof d !== "object") return null;
  return {
    id:            d.id            || uid(),
    pairId:        d.pairId        || null,
    medicationId:  d.medicationId  || null,
    periodId:      d.periodId      || null,
    scheduledTime: d.scheduledTime || null,
    takenAt:       d.takenAt       || null,
    displayTime:   d.displayTime   || null,
    status:        ["taken","missed","late"].includes(d.status) ? d.status : "taken",
  };
}

function sanitizeScheduleLog(raw) {
  if (!raw || typeof raw !== "object") return {};
  var out = {};
  Object.keys(raw).forEach(function(k) {
    var e = raw[k];
    if (!e || typeof e !== "object") return;
    var ta = e.takenAt || "";
    // Legacy: takenAt was "HH:MM" — migrate
    if (ta && ta.length <= 5) {
      out[k] = { takenAt: null, displayTime: ta, periodId: e.periodId || null, medicationId: e.medicationId || null, status: "taken" };
    } else {
      out[k] = {
        takenAt:      e.takenAt      || null,
        displayTime:  e.displayTime  || (e.takenAt ? e.takenAt.slice(11, 16) : null),
        periodId:     e.periodId     || null,
        medicationId: e.medicationId || null,
        status:       e.status       || "taken",
      };
    }
  });
  return out;
}

function sanitizeState(s) {
  if (!s || typeof s !== "object") return null;
  var rawUser = s.user && typeof s.user === "object" ? s.user : null;
  var rawPair = s.pair && typeof s.pair === "object" ? s.pair : null;
  return {
    user: rawUser ? {
      // Preserve the real Supabase id if present — only fall back to a
      // random id for genuinely fresh/local-only profiles.
      id:     (typeof rawUser.id === "string" && rawUser.id.length > 0) ? rawUser.id : uid(),
      email:  rawUser.email  || "",
      name:   String(rawUser.name  || ""),
      role:   ["patient","supporter"].includes(rawUser.role) ? rawUser.role : null,
      pairId: rawUser.pairId || (rawPair && rawPair.id) || null,
    } : null,
    pair: rawPair ? {
      id:          rawPair.id          || uid(),
      patientId:   rawPair.patientId   || null,
      supporterId: rawPair.supporterId || null,
      inviteCode:  rawPair.inviteCode  || newInviteCode(),
      locked:      !!rawPair.locked,
      createdAt:   rawPair.createdAt   || new Date().toISOString(),
    } : null,
    medications:  Array.isArray(s.medications)  ? s.medications.map(sanitizeMed).filter(Boolean)  : [],
    doseLogs:     Array.isArray(s.doseLogs)     ? s.doseLogs.map(sanitizeDoseLog).filter(Boolean) : [],
    scheduleLog:  sanitizeScheduleLog(s.scheduleLog),
    doctorVisits: Array.isArray(s.doctorVisits) ? s.doctorVisits : [],
    settings: (function() {
      var ss = s.settings && typeof s.settings === "object" ? s.settings : {};
      var DEFAULT_TIMES = {
        breakfast_before:"07:30", breakfast_after:"08:00",
        lunch_before:"11:30",     lunch_after:"12:30",
        dinner_before:"17:30",    dinner_after:"18:30",
        bedtime:"22:00"
      };
      var pt = (ss.periodTimes && typeof ss.periodTimes === "object") ? ss.periodTimes : {};
      var merged = {};
      Object.keys(DEFAULT_TIMES).forEach(function(k) { merged[k] = pt[k] || DEFAULT_TIMES[k]; });
      return {
        dayResetHour:  Number(ss.dayResetHour)  || 4,
        reminderTimes: Array.isArray(ss.reminderTimes) ? ss.reminderTimes : [],
        reminderMinutesBefore: Array.isArray(ss.reminderMinutesBefore)
          ? ss.reminderMinutesBefore.filter(function(n){ return typeof n==='number' && n>=0; })
          : [10],
        periodTimes:   merged,
      };
    })(),
  };
}

function loadState() {
  console.log('[PairCare] loadState');
  try {
    // v8 storage
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var clean = sanitizeState(safeJSON(raw));
      if (clean) { console.log('[PairCare] loaded v8'); return clean; }
    }
    // Migrate v6
    var old6 = safeJSON(localStorage.getItem("peirYike_v6") || localStorage.getItem("peiYike_v6"));
    if (old6) {
      var m6 = sanitizeState(old6);
      if (m6) { console.log('[PairCare] migrated from v6'); return m6; }
    }
  } catch(e) { console.error('[PairCare] loadState error:', e); }
  return Object.assign({}, EMPTY_STATE);
}

function saveState(s) {
  try {
    if (!s || typeof s !== "object") return;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    // Also persist user separately for fast reload
    if (s.user && s.user.id) {
      localStorage.setItem(STORAGE_KEY + "_user", JSON.stringify(s.user));
    }
  } catch(e) { console.warn('[PairCare] saveState error:', e); }
}

function loadSavedUser() {
  try {
    var u = safeJSON(localStorage.getItem(STORAGE_KEY + "_user"));
    return (u && u.id) ? u : null;
  } catch(e) { return null; }
}

// ── 5. NOTIFICATIONS ──────────────────────────────────────────────────────────
function requestNotif() {
  try {
    if (!("Notification" in window)) return Promise.resolve(false);
    if (Notification.permission === "granted") return Promise.resolve(true);
    if (Notification.permission === "denied")  return Promise.resolve(false);
    return Notification.requestPermission().then(function(r) { return r === "granted"; });
  } catch(e) { return Promise.resolve(false); }
}

function notify(title, body) {
  try {
    if (typeof Notification === "undefined") return;
    if (Notification.permission !== "granted") return;
    new Notification(title, { body: body, tag: "paircare", icon: "/icons/icon-192.png" });
  } catch(e) {}
}

// ── 6. ERROR BOUNDARY ─────────────────────────────────────────────────────────
function ErrorBoundary(props) {
  React.Component.call(this, props);
  this.state = { crashed: false };
}
ErrorBoundary.prototype = Object.create(React.Component.prototype);
ErrorBoundary.prototype.constructor = ErrorBoundary;
ErrorBoundary.getDerivedStateFromError = function() { return { crashed: true }; };
ErrorBoundary.prototype.componentDidCatch = function(err, info) {
  console.error('[PairCare ErrorBoundary]', err, info);
};
ErrorBoundary.prototype.render = function() {
  if (this.state.crashed) {
    return React.createElement('div', {
      style: { display:'flex', flexDirection:'column', alignItems:'center',
               justifyContent:'center', minHeight:'100svh', padding:'32px',
               textAlign:'center', background:'#FAF7F2', gap:16, fontFamily:'sans-serif' }
    },
      React.createElement('h2', { style:{fontSize:'1.1rem',color:'#231C10'} }, '\u767c\u751f\u932f\u8aa4'),
      React.createElement('p',  { style:{fontSize:'0.82rem',color:'#998870',lineHeight:1.6,maxWidth:300} },
        'PairCare \u767c\u751f\u4e86\u610f\u5916\u932f\u8aa4\u3002'),
      React.createElement('button', {
        onClick: function() { window.location.reload(); },
        style: { padding:'12px 24px',background:'#C4785A',color:'white',border:'none',
                 borderRadius:10,fontSize:'0.9rem',cursor:'pointer',marginTop:8 }
      }, '\u91cd\u65b0\u555f\u52d5'),
      React.createElement('button', {
        onClick: function() { try{localStorage.clear();}catch(e){} window.location.reload(); },
        style: { padding:'10px 20px',background:'#998870',color:'white',border:'none',
                 borderRadius:10,fontSize:'0.82rem',cursor:'pointer' }
      }, '\u6e05\u9664\u8cc7\u6599\u4e26\u91cd\u555f')
    );
  }
  return this.props.children;
};
window.ErrorBoundary = ErrorBoundary;

.onboard-logo p {
  font-size: 0.72rem; color: var(--ink-muted); letter-spacing: 0.25em;
  font-family: 'DM Mono', monospace; text-align: center; margin-top: 6px;
}
.onboard-card {
  width: 100%; background: white; border-radius: var(--radius-lg);
  padding: 30px 26px; border: 1px solid var(--border); box-shadow: var(--shadow);
}
.onboard-card h2 { font-size: 1rem; font-weight: 500; margin-bottom: 20px; letter-spacing: 0.04em; }

/* ── Form elements ── */
input[type="text"], input[type="number"], input[type="time"],
input[type="date"], textarea, select {
  width: 100%; max-width: 100%; min-width: 0; padding: 12px 15px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-family: 'Noto Serif TC', serif; font-size: 0.92rem;
  color: var(--ink); background: var(--cream);
  outline: none; transition: border-color 0.18s, background 0.18s;
  margin-top: 6px; display: block; box-sizing: border-box;
}
input[type="date"] {
  -webkit-appearance: none; appearance: none;
}
input[type="date"]::-webkit-date-and-time-value {
  text-align: left; min-width: 0;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--rose); background: white;
}
label {
  font-size: 0.78rem; font-weight: 500;
  color: var(--ink-light); letter-spacing: 0.06em; display: block;
}
.field { margin-bottom: 18px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 14px 22px; border-radius: var(--radius-sm);
  font-family: 'Noto Serif TC', serif; font-size: 0.92rem; font-weight: 500;
  cursor: pointer; border: none; transition: all 0.18s;
  letter-spacing: 0.04em; white-space: nowrap;
}
.btn-primary { background: var(--rose); color: white; width: 100%; box-shadow: 0 4px 14px rgba(196,120,90,0.28); }
.btn-primary:active { background: var(--rose-dark); transform: scale(0.99); }
.btn-secondary { background: var(--cream); color: var(--ink); border: 1.5px solid var(--border); width: 100%; margin-top: 10px; }
.btn-secondary:active { background: var(--warm); }
.btn-ghost { background: transparent; color: var(--ink-light); padding: 9px 14px; font-size: 0.82rem; }
.btn-ghost:active { color: var(--rose); }
.btn-danger { background: #FBEEEE; color: #A8453A; border: 1.5px solid #F0D5D2; font-size: 0.85rem; }
.btn-sm { padding: 9px 16px; font-size: 0.82rem; }
.btn-icon {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px; border-radius: var(--radius-sm);
  background: var(--cream); border: 1.5px solid var(--border);
  color: var(--ink-light); cursor: pointer; transition: all 0.15s; line-height: 1;
}
.btn-icon:active { background: var(--warm); color: var(--ink); }
.btn-icon svg { width: 20px; height: 20px; }

/* ── Nav ── */
.nav {
  display: flex; background: white; border-top: 1px solid var(--border);
  padding: 8px 0 env(safe-area-inset-bottom, 8px);
  position: sticky; bottom: 0; z-index: 20;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 8px 4px; cursor: pointer; border: none;
  background: transparent; color: var(--ink-muted); transition: color 0.15s;
  font-family: 'Noto Serif TC', serif;
}
.nav-item.active { color: var(--rose); }
.nav-item svg { width: 23px; height: 23px; }
.nav-item span { font-size: 0.67rem; font-weight: 500; letter-spacing: 0.04em; }

/* ── Header ── */
.header {
  padding: 20px 20px 14px; background: var(--paper);
  position: sticky; top: 0; z-index: 10;
}
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.header h2 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); }
.date-chip {
  font-family: 'DM Mono', monospace; font-size: 0.7rem;
  color: var(--ink-muted); background: white;
  padding: 5px 12px; border-radius: 20px; flex-shrink: 0;
  border: 1px solid var(--border);
}
.header-icons { display: flex; gap: 8px; }

/* ── Main ── */
.main { flex: 1; overflow-y: auto; padding: 8px 18px 18px; padding-bottom: 96px; }

/* ── Stock summary line (one-line, bottom of home page) ── */
.stock-summary-line {
  font-size: 0.78rem; color: var(--ink-muted);
  padding: 18px 4px 10px; cursor: pointer; text-align: center;
}
.stock-summary-line.warn { color: var(--rose-dark); font-weight: 500; }

/* ════════════════════════════════════════════════════════════════════════
   HERO CARD — the visual anchor of the home page ("next dose")
   ════════════════════════════════════════════════════════════════════════ */
.hero-card {
  position: relative;
  background: linear-gradient(135deg, var(--rose) 0%, var(--rose-light) 100%);
  border-radius: var(--radius-lg);
  padding: 24px 24px 22px;
  margin-bottom: 18px;
  min-height: 168px;
  color: white;
  box-shadow: 0 10px 30px rgba(196,120,90,0.30);
  display: flex; flex-direction: column; justify-content: space-between;
  overflow: hidden;
}
.hero-card::after {
  /* soft decorative glow, purely visual */
  content: ''; position: absolute; right: -40px; top: -40px;
  width: 160px; height: 160px; border-radius: 50%;
  background: rgba(255,255,255,0.12);
}
.hero-top-row {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.hero-date-chip {
  font-family: 'DM Mono', monospace; font-size: 0.7rem; font-weight: 500;
  color: white; background: rgba(255,255,255,0.22);
  padding: 5px 12px; border-radius: 20px; flex-shrink: 0;
}
.hero-card .hero-label {
  font-size: 0.74rem; font-weight: 600; letter-spacing: 0.1em;
  opacity: 0.88; margin-bottom: 0;
}
.hero-card .hero-meds {
  font-size: 1.18rem; font-weight: 700; line-height: 1.35;
  margin-bottom: 14px; max-width: 86%;
}
.hero-card .hero-time-row {
  display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px;
}
.hero-card .hero-time {
  font-family: 'DM Mono', monospace; font-size: 2.1rem; font-weight: 500; line-height: 1;
}
.hero-card .hero-period {
  font-size: 0.85rem; opacity: 0.92; font-weight: 500;
}
.hero-card .hero-countdown {
  font-size: 0.84rem; opacity: 0.92; margin-top: 2px;
}
.hero-card .hero-btn {
  margin-top: 16px; align-self: flex-start;
  background: white; color: var(--rose-dark);
  border: none; border-radius: 999px; padding: 11px 26px;
  font-family: 'Noto Serif TC', serif; font-size: 0.88rem; font-weight: 600;
  cursor: pointer; box-shadow: 0 4px 14px rgba(35,28,16,0.16);
  transition: transform 0.15s;
}
.hero-card .hero-btn:active { transform: scale(0.96); }
.hero-card.hero-empty {
  background: linear-gradient(135deg, var(--sage) 0%, var(--sage-light) 100%);
  align-items: center; text-align: center; justify-content: center;
  box-shadow: 0 10px 30px rgba(106,148,120,0.25);
}
.hero-card.hero-empty .hero-emoji { font-size: 2rem; margin-bottom: 6px; }
.hero-card.hero-empty .hero-empty-text { font-size: 0.95rem; font-weight: 500; }

/* ════════════════════════════════════════════════════════════════════════
   TIME-SLOT CARDS — replace plain "period cards" with friendlier blocks
   ════════════════════════════════════════════════════════════════════════ */
.section-label-row {
  font-size: 0.76rem; font-weight: 600; color: var(--ink-muted);
  letter-spacing: 0.1em; margin: 18px 4px 10px;
}
.period-group { margin-bottom: 14px; }
.period-card {
  background: white; border-radius: var(--radius);
  border: 1.5px solid var(--border); overflow: hidden;
  box-shadow: var(--shadow-sm); transition: border-color 0.2s, box-shadow 0.2s;
}
.period-card.is-now {
  border-color: var(--rose);
  box-shadow: 0 0 0 3px var(--rose-pale), var(--shadow);
}
.period-card.is-done   { border-color: var(--sage-light); background: var(--sage-pale); }
.period-card.is-late   { border-color: var(--amber); }

.period-slot-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 8px;
}
.period-slot-icon {
  font-size: 1.3rem; line-height: 1; flex-shrink: 0;
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--cream); display: flex; align-items: center; justify-content: center;
}
.period-card.is-now .period-slot-icon  { background: var(--rose-pale); }
.period-card.is-done .period-slot-icon { background: var(--sage-light); }
.period-slot-title { flex: 1; }
.period-slot-label { font-size: 0.95rem; font-weight: 600; color: var(--ink); }
.period-slot-time  { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--ink-muted); margin-top: 1px; }
.period-slot-status {
  font-size: 0.72rem; font-weight: 600; padding: 4px 11px; border-radius: 20px;
  flex-shrink: 0;
}
.period-slot-status.due     { background: var(--rose-pale); color: var(--rose-dark); }
.period-slot-status.done    { background: var(--sage-light); color: var(--sage-dark); }
.period-slot-status.late    { background: var(--amber-pale); color: var(--amber); }
.period-slot-status.pending { background: var(--cream); color: var(--ink-muted); }

.period-meds { padding: 4px 16px 14px; }
.period-med-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; gap: 12px;
}
.period-med-row + .period-med-row { border-top: 1px solid rgba(35,28,16,0.06); }
.period-med-name { font-size: 0.9rem; font-weight: 500; color: var(--ink); }
.period-med-dose { font-family: 'DM Mono', monospace; font-size: 0.76rem; color: var(--ink-muted); }
.period-med-check { font-size: 0.95rem; flex-shrink: 0; white-space: nowrap; }
.period-med-taken { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn-undo-inline {
  padding: 4px 11px; border-radius: 999px; flex-shrink: 0;
  background: transparent; color: var(--ink-muted); border: 1px solid var(--border);
  font-family: 'Noto Serif TC', serif; font-size: 0.7rem; cursor: pointer;
}
.btn-undo-inline:active { background: var(--cream); }

.period-footer {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 10px 16px 14px;
}
.period-footer.done  { background: transparent; }

.btn-take-period {
  padding: 7px 18px; border-radius: 999px; flex-shrink: 0;
  background: var(--rose); color: white; border: none;
  font-family: 'Noto Serif TC', serif; font-size: 0.8rem; font-weight: 600;
  cursor: pointer; transition: background 0.15s; box-shadow: 0 3px 10px rgba(196,120,90,0.3);
}
.btn-take-period:active { background: var(--rose-dark); }
.btn-undo {
  padding: 6px 14px; border-radius: 999px;
  background: transparent; color: var(--ink-muted);
  border: 1px solid var(--border);
  font-family: 'Noto Serif TC', serif; font-size: 0.75rem;
  cursor: pointer;
}

/* ════════════════════════════════════════════════════════════════════════
   SMALL INFO CARDS — visit countdown + stock, secondary on home page
   ════════════════════════════════════════════════════════════════════════ */
.mini-card {
  flex: 1; background: white; border-radius: var(--radius);
  border: 1.5px solid var(--border); padding: 14px 15px;
  box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.12s;
}
.mini-card:active { transform: scale(0.98); }
.mini-card.alert  { background: var(--rose-pale); border-color: var(--rose-light); }
.mini-card.reminder { background: var(--amber-pale); border-color: #DFC070; }
.mini-card .mini-label {
  font-size: 0.68rem; color: var(--ink-muted); font-weight: 600;
  letter-spacing: 0.06em; margin-bottom: 6px; display: flex; align-items: center; gap: 5px;
}
.mini-card .mini-value { font-size: 1.05rem; font-weight: 700; color: var(--ink); line-height: 1.25; }
.mini-card .mini-sub { font-size: 0.72rem; color: var(--ink-muted); margin-top: 2px; }
.mini-card.alert .mini-value { color: var(--rose-dark); }
.mini-card.reminder .mini-value { color: var(--amber); }

/* ── Inventory card (legacy, kept for compat) ── */
.inventory-card { background: white; border-radius: var(--radius); border: 1.5px solid var(--border); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow-sm); }
.inventory-card .card-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.inventory-card .card-header h4 { font-size: 0.82rem; font-weight: 600; color: var(--ink-light); letter-spacing: 0.08em; }
.inventory-card .card-body { padding: 4px 0; }

.inv-row {
  display: flex; align-items: center; padding: 13px 16px;
  border-bottom: 1px solid var(--border); gap: 12px;
}
.inv-row:last-child { border-bottom: none; }
.inv-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); flex-shrink: 0; }
.inv-dot.low { background: var(--rose); }
.inv-info { flex: 1; }
.inv-name { font-size: 0.92rem; font-weight: 500; }
.inv-sub  { font-size: 0.72rem; color: var(--ink-muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
.inv-finish { text-align: right; }
.inv-days { font-family: 'DM Mono', monospace; font-size: 0.82rem; color: var(--rose); font-weight: 500; }
.inv-date { font-size: 0.68rem; color: var(--ink-muted); margin-top: 2px; }

/* ════════════════════════════════════════════════════════════════════════
   MEDICATION CARDS (simplified) — name, schedule line, stock bar only
   Color tiers: green >14d, orange 7-14d, red 3-6d, deep-red <=2d
   ════════════════════════════════════════════════════════════════════════ */
.med-card-simple {
  display: flex; align-items: flex-start; gap: 14px;
  background: white; border-radius: var(--radius); border: 1.5px solid var(--border);
  padding: 16px 18px; margin-bottom: 12px; cursor: pointer;
  box-shadow: var(--shadow-sm); transition: transform 0.12s;
}
.med-card-simple:active { transform: scale(0.99); }
.med-card-simple.paused { opacity: 0.72; }
.med-simple-icon {
  width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
  background: var(--rose-pale); display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
}
.med-card-simple.paused .med-simple-icon { background: var(--cream); }
.med-simple-photo { object-fit: cover; }
.med-simple-body { flex: 1; min-width: 0; }
.med-simple-name { font-size: 1rem; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
.med-simple-sched { font-size: 0.8rem; color: var(--ink-muted); margin-bottom: 8px; }
.med-simple-stock { font-size: 0.85rem; font-weight: 500; margin-bottom: 7px; }
.med-simple-stock.lv-green   { color: var(--sage-dark); }
.med-simple-stock.lv-orange  { color: #B8782A; }
.med-simple-stock.lv-red     { color: #C0524A; }
.med-simple-stock.lv-deepred { color: #8C2F28; font-weight: 700; }
.med-simple-bar-track {
  height: 6px; border-radius: 4px; background: var(--cream); overflow: hidden;
}
.med-simple-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
.med-simple-bar-fill.lv-green   { background: var(--sage); }
.med-simple-bar-fill.lv-orange  { background: #D9923B; }
.med-simple-bar-fill.lv-red     { background: #C0524A; }
.med-simple-bar-fill.lv-deepred { background: #8C2F28; }

.med-card {
  background: white; border-radius: var(--radius-lg);
  border: 1.5px solid var(--border); padding: 18px 20px;
  margin-bottom: 14px; position: relative; overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.med-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
.med-card-name-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.med-card-icon {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  background: var(--rose-pale); display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
}
.med-card.paused .med-card-icon { background: var(--cream); opacity: 0.7; }
.med-card-name { font-size: 1rem; font-weight: 600; color: var(--ink); }
.status-tag {
  font-size: 0.65rem; font-family: 'DM Mono', monospace;
  padding: 4px 10px; border-radius: 20px; letter-spacing: 0.04em; flex-shrink: 0; font-weight: 500;
}
.tag-active { background: var(--sage-pale); color: var(--sage-dark); }
.tag-paused { background: var(--cream); color: var(--ink-muted); }

.med-period-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; padding-left: 48px; }
.med-period-tag {
  font-size: 0.72rem; background: var(--cream); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 11px; color: var(--ink-light); font-weight: 500;
}

/* Progress-bar stock display, replacing raw numbers */
.med-stock-block { padding-left: 48px; }
.med-stock-bar-track {
  height: 8px; border-radius: 5px; background: var(--cream); overflow: hidden; margin-bottom: 8px;
}
.med-stock-bar-fill { height: 100%; border-radius: 5px; transition: width 0.4s; }
.med-stock-bar-fill.lv-green  { background: var(--sage); }
.med-stock-bar-fill.lv-yellow { background: #D9B23B; }
.med-stock-bar-fill.lv-orange { background: var(--rose-light); }
.med-stock-bar-fill.lv-red    { background: #C0524A; }
.med-stock-text {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: 0.82rem; color: var(--ink-light);
}
.med-stock-text .left b { font-family: 'DM Mono', monospace; font-weight: 600; color: var(--ink); }
.med-stock-text .right {
  font-size: 0.74rem; font-weight: 600; padding: 3px 10px; border-radius: 20px;
}
.med-stock-text .right.lv-green  { background: var(--sage-pale); color: var(--sage-dark); }
.med-stock-text .right.lv-yellow { background: #FBF1D2; color: #97781E; }
.med-stock-text .right.lv-orange { background: var(--rose-pale); color: var(--rose-dark); }
.med-stock-text .right.lv-red    { background: #FBE4E2; color: #A8453A; }

.med-footer { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); padding-left: 48px; }

/* legacy aliases kept so old inline styles referencing these still render fine */
.med-stats { display: flex; gap: 20px; }
.med-stat .val { font-family: 'DM Mono', monospace; font-size: 1.3rem; color: var(--rose); line-height: 1; font-weight: 500; }
.med-stat .lbl { font-size: 0.65rem; color: var(--ink-muted); margin-top: 2px; letter-spacing: 0.04em; }
.progress-wrap { margin-top: 12px; background: var(--cream); border-radius: 5px; height: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--rose); border-radius: 5px; transition: width 0.4s; }
.estimate-row { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--ink-light); }
.estimate-row .days { font-family: 'DM Mono', monospace; color: var(--rose); font-weight: 500; }

/* ════════════════════════════════════════════════════════════════════════
   MEDICATION DETAIL — big icon header + info cards
   ════════════════════════════════════════════════════════════════════════ */
.med-detail-header {
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 20px 22px; text-align: center;
}
.med-detail-icon {
  width: 72px; height: 72px; border-radius: 24px;
  background: linear-gradient(135deg, var(--rose-pale), var(--rose-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; margin-bottom: 14px;
  box-shadow: 0 6px 18px rgba(196,120,90,0.20);
}

/* ── Photo upload (med detail header) ── */
.med-photo-wrap {
  position: relative; width: 72px; height: 72px; margin-bottom: 14px; cursor: pointer;
}
.med-photo-img {
  width: 72px; height: 72px; border-radius: 24px; object-fit: cover;
  box-shadow: 0 6px 18px rgba(196,120,90,0.20);
}
.med-photo-badge {
  position: absolute; bottom: -4px; right: -4px;
  width: 26px; height: 26px; border-radius: 50%;
  background: white; border: 2px solid var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; box-shadow: var(--shadow-sm);
}

/* ── Dose stepper (用量 +/-) ── */
.dose-stepper { display: flex; align-items: center; gap: 8px; }
.dose-step-btn {
  width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid var(--border);
  background: var(--cream); color: var(--ink); font-size: 1rem; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.dose-step-btn:active { background: var(--rose-pale); }
.dose-step-value {
  min-width: 32px; text-align: center; font-family: 'DM Mono', monospace;
  font-size: 0.95rem; font-weight: 600; color: var(--ink);
  border: 1.5px solid var(--border); border-radius: 8px; padding: 4px 6px; background: white;
}
.dose-step-unit { font-size: 0.78rem; color: var(--ink-muted); }

/* ── Refill form (補充藥品) ── */
.refill-form {
  background: var(--cream); border-radius: var(--radius-sm);
  padding: 14px 16px; margin-top: 10px; margin-bottom: 14px;
}
.med-detail-name { font-size: 1.25rem; font-weight: 700; color: var(--ink); }
.med-detail-sub { font-size: 0.82rem; color: var(--ink-muted); margin-top: 4px; }
.med-detail-card {
  background: white; border-radius: var(--radius); border: 1.5px solid var(--border);
  padding: 4px 18px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
}
.med-detail-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border-bottom: 1px solid rgba(35,28,16,0.06);
}
.med-detail-row:last-child { border-bottom: none; }
.med-detail-row .label { font-size: 0.85rem; color: var(--ink-muted); }
.med-detail-row .value { font-size: 0.92rem; font-weight: 600; color: var(--ink); text-align: right; }

/* ════════════════════════════════════════════════════════════════════════
   VISIT TIMELINE
   ════════════════════════════════════════════════════════════════════════ */
.visit-summary-card {
  background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border);
  padding: 18px 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
}
.visit-summary-row {
  display: flex; align-items: center; justify-content: space-between; padding: 9px 0;
}
.visit-summary-row .label { font-size: 0.82rem; color: var(--ink-muted); }
.visit-summary-row .value { font-size: 0.92rem; font-weight: 600; color: var(--ink); }
.visit-next-card {
  background: linear-gradient(135deg, var(--rose-pale), white);
  border-radius: var(--radius-lg); border: 1.5px solid var(--rose-light);
  padding: 18px 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
}
.visit-next-card .label { font-size: 0.74rem; font-weight: 600; color: var(--rose-dark); letter-spacing: 0.06em; margin-bottom: 6px; }
.visit-next-card .date { font-size: 1.05rem; font-weight: 700; color: var(--ink); }
.visit-next-card .days { font-size: 0.88rem; color: var(--rose-dark); font-weight: 600; margin-top: 4px; }

.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 6px; bottom: 8px; width: 2px; background: var(--border); }
.visit-item { position: relative; margin-bottom: 20px; }
.visit-item::before {
  content: ''; position: absolute; left: -22px; top: 9px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--rose); border: 2.5px solid var(--paper); box-shadow: 0 0 0 2px var(--rose-light);
}
.visit-card { background: white; border-radius: var(--radius); border: 1.5px solid var(--border); overflow: hidden; box-shadow: var(--shadow-sm); }
.visit-date-bar { background: var(--rose-pale); padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; }
.visit-date { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--rose-dark); font-weight: 600; letter-spacing: 0.04em; }
.visit-hospital { font-size: 0.75rem; color: var(--ink-muted); }
.visit-body { padding: 15px 16px; }
.visit-note { font-size: 0.85rem; color: var(--ink-light); margin-bottom: 12px; line-height: 1.6; font-style: italic; }
.change-list { display: flex; flex-direction: column; gap: 7px; }
.change-chip { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 12px; font-size: 0.82rem; font-weight: 500; }
.chip-continue { background: var(--sage-pale); color: var(--sage-dark); }
.chip-stop     { background: var(--cream); color: var(--ink-muted); }
.chip-new      { background: var(--amber-pale); color: var(--amber); }
.chip-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; padding: 2px 7px; border-radius: 5px; background: rgba(0,0,0,0.06); }

/* ════════════════════════════════════════════════════════════════════════
   DOSE LOG PAGE — completion ring + simple daily list
   ════════════════════════════════════════════════════════════════════════ */
.log-ring-card {
  background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border);
  padding: 22px 20px; margin-bottom: 20px; text-align: center; box-shadow: var(--shadow-sm);
}
.log-ring-wrap { position: relative; width: 110px; height: 110px; margin: 0 auto 10px; }
.log-ring-wrap svg { width: 110px; height: 110px; transform: rotate(-90deg); }
.log-ring-wrap .track { fill: none; stroke: var(--cream); stroke-width: 9; }
.log-ring-wrap .fill  { fill: none; stroke: var(--rose); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
.log-ring-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--rose); }
.log-ring-label { font-size: 0.85rem; color: var(--ink-muted); }
.daily-log-row {
  display: flex; align-items: center; justify-content: space-between;
  background: white; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
  padding: 13px 16px; margin-bottom: 0; box-shadow: var(--shadow-sm); cursor: pointer;
}
.daily-log-row.expanded { border-radius: var(--radius-sm) var(--radius-sm) 0 0; border-bottom-color: transparent; }
.daily-log-date { font-size: 0.88rem; font-weight: 600; color: var(--ink); }
.daily-log-count { font-size: 0.8rem; color: var(--ink-muted); margin-left: 8px; }
.daily-log-status { font-size: 1.05rem; }

/* Circular checkmark status dot — replaces emoji (✅🟡⚪) */
.log-status-dot {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--border); background: transparent; color: transparent;
  font-size: 0.7rem; font-weight: 700;
}
.log-status-dot.done {
  background: var(--sage); border-color: var(--sage); color: white;
}

/* Expanded per-medication breakdown — same bg as page, inset on both sides */
.daily-log-detail {
  background: transparent; border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  padding: 4px 28px 10px; margin-bottom: 8px;
}
.daily-log-detail-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 0; font-size: 0.82rem; color: var(--ink-light);
  border-top: 1px solid rgba(35,28,16,0.06);
}
.daily-log-detail-row:first-child { border-top: none; }

/* Range navigator (‹ 6/14-6/20 › or ‹ 2026.06 ›) */
.log-range-nav {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin-bottom: 14px;
}
.log-range-arrow {
  background: var(--cream); border: 1.5px solid var(--border); border-radius: 50%;
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  font-size: 1rem; color: var(--ink-light); cursor: pointer; flex-shrink: 0;
}
.log-range-arrow:active { background: var(--rose-pale); color: var(--rose-dark); }
.log-range-label {
  font-family: 'DM Mono', monospace; font-size: 0.92rem; font-weight: 600; color: var(--ink);
  min-width: 110px;
}

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(35,28,16,0.42);
  z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal {
  background: var(--paper);
  border-radius: 26px 26px 0 0;
  width: 100%; max-width: 430px;
  max-height: 90vh;
  max-height: 90dvh;
  display: flex; flex-direction: column;
  animation: slideUp 0.26s cubic-bezier(.32,.72,0,1);
}
.modal-top {
  padding: 22px 24px 0;
  flex-shrink: 0;
}
.modal-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 0 24px;
  padding-bottom: max(40px, calc(24px + env(safe-area-inset-bottom, 16px)));
}
@keyframes slideUp {
  from { transform: translateY(60px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.modal-handle {
  width: 40px; height: 4px;
  background: var(--border); border-radius: 2px;
  margin: 0 auto 20px;
}
.modal h3 {
  font-size: 1.08rem; font-weight: 600;
  letter-spacing: 0.04em; margin-bottom: 18px;
}

/* ── Misc ── */
.toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: white; padding: 12px 24px; border-radius: 24px;
  font-size: 0.85rem; font-weight: 500; z-index: 200;
  animation: toastIn 0.2s ease; white-space: nowrap; box-shadow: var(--shadow);
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

.viewer-banner { background: var(--amber-pale); padding: 10px 18px; font-size: 0.75rem; color: var(--amber); letter-spacing: 0.06em; text-align: center; font-family: 'DM Mono', monospace; font-weight: 500; }
.notif-banner { background: var(--sage-pale); padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.8rem; font-weight: 500; color: var(--sage-dark); }
.notif-banner button { background: var(--sage); color: white; border: none; border-radius: 999px; padding: 7px 16px; font-size: 0.78rem; font-weight: 500; cursor: pointer; font-family: 'Noto Serif TC', serif; }

.section-title { font-size: 0.74rem; font-weight: 600; color: var(--ink-muted); letter-spacing: 0.12em; text-transform: uppercase; margin: 22px 0 10px; font-family: 'DM Mono', monospace; }

/* ── List tab switcher (服用中 / 已停藥) ── */
.list-tab-row {
  display: flex; gap: 8px; margin: 4px 0 16px;
  background: var(--cream); border-radius: 999px; padding: 4px;
}
.list-tab {
  flex: 1; padding: 9px 0; border-radius: 999px; border: none;
  background: transparent; color: var(--ink-muted);
  font-family: 'Noto Serif TC', serif; font-size: 0.85rem; font-weight: 500;
  cursor: pointer; transition: all 0.18s; display: flex; align-items: center;
  justify-content: center; gap: 6px;
}
.list-tab.active { background: white; color: var(--rose-dark); box-shadow: var(--shadow-sm); font-weight: 600; }
.list-tab-count {
  font-family: 'DM Mono', monospace; font-size: 0.72rem;
  background: rgba(0,0,0,0.06); padding: 1px 7px; border-radius: 10px;
}
.list-tab.active .list-tab-count { background: var(--rose-pale); color: var(--rose-dark); }
.section-tip { font-size: 0.78rem; color: var(--ink-muted); margin-bottom: 16px; line-height: 1.55; }

.empty-state { text-align: center; padding: 52px 20px; color: var(--ink-muted); }
.empty-state .icon { font-size: 2.8rem; margin-bottom: 14px; }
.empty-state p { font-size: 0.9rem; }

.fab {
  position: fixed;
  bottom: calc(58px + env(safe-area-inset-bottom, 6px) + 18px);
  right: 20px; width: 56px; height: 56px;
  border-radius: 50%; background: var(--rose); color: white; border: none;
  font-size: 1.5rem; cursor: pointer; box-shadow: 0 6px 20px rgba(196,120,90,0.40);
  display: flex; align-items: center; justify-content: center; transition: all 0.18s; z-index: 50;
}
.fab:active { background: var(--rose-dark); transform: scale(0.95); }

.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

.pair-code-display { background: var(--cream); border-radius: var(--radius); padding: 20px; text-align: center; margin: 16px 0; border: 1.5px dashed var(--rose-light); }
.pair-code-display .code { font-family: 'DM Mono', monospace; font-size: 2.8rem; color: var(--rose); letter-spacing: 0.3em; font-weight: 500; }
.pair-code-display small { display: block; font-size: 0.72rem; color: var(--ink-muted); margin-top: 5px; }

.pair-info { display: flex; align-items: center; gap: 10px; padding: 13px 15px; background: var(--sage-pale); border-radius: var(--radius-sm); border: 1.5px solid var(--sage-light); margin-bottom: 14px; font-size: 0.83rem; color: var(--sage-dark); font-weight: 500; }

.med-checkbox-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border-bottom: 1px solid rgba(35,28,16,0.06); cursor: pointer;
}
.med-checkbox-row:last-child { border-bottom: none; }
.med-checkbox-label { font-size: 0.92rem; font-weight: 500; color: var(--ink); }
.med-checkbox-sub { font-size: 0.72rem; color: var(--ink-muted); margin-top: 2px; font-family: 'DM Mono', monospace; }
.cb-box {
  width: 23px; height: 23px; border-radius: 8px; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  background: var(--cream); flex-shrink: 0; transition: all 0.15s;
}
.cb-box.checked { background: var(--sage); border-color: var(--sage); }
.cb-check { color: white; font-size: 0.85rem; font-weight: 700; }

/* ── Period pill selector ── */
.period-pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
.period-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 15px; border-radius: 999px;
  border: 1.5px solid var(--border); background: white; color: var(--ink-light);
  font-size: 0.82rem; font-weight: 500; cursor: pointer;
  transition: background 0.14s, border-color 0.14s, color 0.14s;
  user-select: none; white-space: nowrap;
}
.period-pill:active { transform: scale(0.97); }
.period-pill.selected { background: var(--rose-pale); border-color: var(--rose); color: var(--rose-dark); }
.period-pill-icon { font-size: 0.9rem; line-height: 1; }

/* ── Schedule box (大方框 chip, used in MedDetailModal 服藥時段) ── */
.sched-box {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: calc((100% - 20px) / 3); padding: 14px 8px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: white; color: var(--ink-light);
  font-size: 0.82rem; font-weight: 500; cursor: pointer;
  transition: background 0.14s, border-color 0.14s, color 0.14s;
}
.sched-box:active { transform: scale(0.97); }
.sched-box.selected { background: var(--rose-pale); border-color: var(--rose); color: var(--rose-dark); font-weight: 600; }

/* ── Photo action-sheet buttons ── */
.action-sheet-btn {
  width: 100%; text-align: left; display: flex; align-items: center; gap: 10px;
  padding: 16px 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
  background: white; color: var(--ink); font-family: 'Noto Serif TC', serif;
  font-size: 0.95rem; font-weight: 500; cursor: pointer; margin-bottom: 10px;
}
.action-sheet-btn:active { background: var(--cream); }
.action-sheet-btn.danger { color: #C0524A; border-color: #F0D5D2; }

.period-dose-area { background: var(--cream); border-radius: var(--radius-sm); padding: 13px 15px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
.period-dose-row-item { display: flex; align-items: center; gap: 10px; }
.period-dose-row-item .pill-label { font-size: 0.8rem; color: var(--ink-light); font-weight: 500; min-width: 60px; }
.period-dose-row-item input { width: 72px; margin-top: 0; text-align: center; font-size: 0.9rem; padding: 8px 10px; }
.period-dose-row-item input[type="time"] { width: 110px; flex: none; }
.period-dose-row-item .dose-unit { font-size: 0.78rem; color: var(--ink-muted); }

.period-section-label { font-size: 0.72rem; font-weight: 600; color: var(--ink-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; font-family: 'DM Mono', monospace; }

.period-time-grid { display: flex; flex-direction: column; gap: 0; background: white; border-radius: var(--radius); border: 1.5px solid var(--border); overflow: hidden; margin-bottom: 16px; }
.period-time-row { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(35,28,16,0.06); gap: 10px; }
.period-time-row:last-child { border-bottom: none; }
.period-time-icon { font-size: 1rem; flex-shrink: 0; }
.period-time-label { flex: 1; font-size: 0.88rem; font-weight: 500; color: var(--ink); }
.period-time-row input[type="time"] { width: 100px; margin-top: 0; padding: 6px 10px; font-size: 0.85rem; text-align: center; flex-shrink: 0; }

/* Settings */
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid rgba(35,28,16,0.06); }

/* ── Collapsible section row (e.g. 服藥時段預設時間) ── */
.collapsible-row {
  display: flex; align-items: center; justify-content: space-between;
  background: white; border-radius: 12px; border: 1.5px solid var(--border);
  padding: 14px 16px; margin-bottom: 4px; cursor: pointer;
}
.collapsible-chevron {
  font-size: 1.3rem; color: var(--ink-muted); transform: rotate(90deg);
  transition: transform 0.2s; flex-shrink: 0;
}
.collapsible-chevron.open { transform: rotate(-90deg); }
.settings-row:last-child { border-bottom: none; }
.settings-label { font-size: 0.92rem; font-weight: 500; }
.settings-sub { font-size: 0.75rem; color: var(--ink-muted); margin-top: 2px; }
